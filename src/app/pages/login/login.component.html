<app-navbar></app-navbar>

<main class="login-main">
  <div class="login-card">

    <!-- Subcomponente 1: Selector de Roles y Encabezado Dinámico (Lego) -->
    <app-login-roles
      [rolSeleccionado]="rolSeleccionado"
      (rolSelected)="seleccionarRol($event)"
    ></app-login-roles>

    <!-- Subcomponente 2: Formulario reactivo de login (Lego) -->
    <app-login-form
      [loginForm]="loginForm"
      [rolSeleccionado]="rolSeleccionado"
      [errorMessage]="errorMessage"
      [logoutMessage]="logoutMessage"
      [portalAlert]="portalAlert"
      (formSubmitted)="onSubmit()"
    ></app-login-form>

    <!-- Subcomponente 3: Credenciales de prueba oficiales (Lego) -->
    <app-login-credenciales
      [rolSeleccionado]="rolSeleccionado"
      (credencialSelected)="cargarCredencial($event.usuario, $event.clave)"
    ></app-login-credenciales>

  </div>
</main>

<app-calaveras></app-calaveras>
<app-footer></app-footer>
