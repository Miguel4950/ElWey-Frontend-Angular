<app-navbar></app-navbar>

<main class="login-main">
  <div class="login-card" style="max-width: 480px;">
    <!-- Encabezado de la Tarjeta -->
    <div class="login-header">
      <span class="login-subtitle">Registro de Cuenta</span>
      <h1 class="login-title">Crear Cuenta</h1>
      <p class="login-desc">
        Regístrate para realizar pedidos y gestionar tus entregas
      </p>
    </div>

    <!-- Subcomponente: Formulario reactivo de registro (Lego) -->
    <app-registro-form
      [registroForm]="registroForm"
      [errorMessage]="errorMessage"
      (formSubmitted)="onSubmit()"
    ></app-registro-form>

    <!-- Enlace inferior para ir a Login -->
    <div class="login-footer-box">
      <a [routerLink]="['/login']" class="link-registro">
        ¿Ya tienes cuenta? Inicia sesión aquí
      </a>
    </div>
  </div>
</main>

<app-calaveras></app-calaveras>
<app-footer></app-footer>
