<!-- =========================================================================
     SECCION DE BIENVENIDA / HERO
     ========================================================================= -->
<section id="bienvenida" class="seccion-hero">
  <div class="badge-estado-servicio" role="status" aria-label="Estado operativo del restaurante">
    <span class="punto-vivo"></span>
    <span class="texto-estado"><strong>Abierto Ahora:</strong> Domicilios Activos en Bogotá • Entrega: 25-40 min</span>
  </div>

  <img src="/images/logo_el_wey.jpg" alt="Logotipo grande de El Wey" width="200"
    height="200" class="img-hero-logo" />
  <p class="etiqueta-subtitulo">
    <strong>Comida Mexicana Auténtica - Bogotá, Colombia</strong>
  </p>

  <!-- Unico H1 en todo el documento para jerarquía SEO estricta -->
  <h1>El Wey</h1>

  <p class="texto-bienvenida">
    Sabor de México en el corazón de Bogotá. Recetas auténticas, ambiente
    único y el alma de la tradición en cada bocado.
  </p>

  <div class="contenedor-botones">
    <a [routerLink]="['/comidas/tarjetas']" class="btn-accion-rojo">Ver Menú Completo</a>
    <a [routerLink]="['/comidas/tabla']" class="btn-accion-borde">Ver en Formato Tabla</a>
  </div>
</section>
