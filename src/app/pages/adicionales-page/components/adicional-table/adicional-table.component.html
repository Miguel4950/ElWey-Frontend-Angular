<div class="tabla-contenedor-responsive">
  <table class="tabla-elwey">
    <thead>
      <tr>
        <th class="col-id">ID</th>
        <th>Nombre del Adicional</th>
        <th class="col-precio">Precio Unitario</th>
        <th class="col-estado">Estado</th>
        <th class="col-acciones">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (adic of adicionalesArray(); track adic.id) {
        <tr>
          <td class="celda-id">
            <strong>#{{ adic.id }}</strong>
          </td>

          <td class="celda-nombre">
            <span class="nombre-adicional-texto">{{ adic.nombre }}</span>
          </td>

          <td class="celda-precio">
            ${{ adic.precio | number:'1.0-0' }}
          </td>

          <td class="col-estado">
            <span
              class="badge-estado"
              [class.badge-activo]="adic.activo !== false"
              [class.badge-inactivo]="adic.activo === false"
            >
              <span class="status-dot" [class.dot-verde]="adic.activo !== false" [class.dot-gris]="adic.activo === false"></span>
              {{ adic.activo !== false ? 'Activo' : 'Inactivo' }}
            </span>
          </td>

          <td class="celda-acciones">
            <div class="grupo-acciones">
              <button
                type="button"
                (click)="editar(adic)"
                class="btn-accion btn-editar"
                title="Editar adicional"
              >
                Editar
              </button>
              <button
                type="button"
                (click)="eliminar(adic.id)"
                class="btn-accion btn-eliminar"
                title="Eliminar adicional"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="celda-vacia">
            No se han registrado adicionales en el sistema.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
