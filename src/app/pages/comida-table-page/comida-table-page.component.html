<app-navbar></app-navbar>

<main class="main-tabla-page">
  <div class="contenedor-gestion">

    <!-- Alerta de Error al eliminar o interactuar -->
    @if (errorMessage) {
      <div class="alerta-error-comida">
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- =========================================================================
         MODO 1: VISTA DE TARJETAS (Subcomponente ComidaCardsComponent)
         ========================================================================= -->
    @if (esVistaTarjetas) {
      <div class="header-menu-tarjetas">
        <div>
          <p class="subtitulo-menu-tarjetas">Carta y Especialidades</p>
          <h1 class="titulo-menu-tarjetas">Menú Taquería</h1>
          <p class="desc-menu-tarjetas">
            Recetas tradicionales elaboradas con ingredientes auténticos y maíz nixtamalizado.
          </p>
        </div>
        @if (esPersonal) {
          <div class="acciones-header-tarjetas">
            <a [routerLink]="['/comidas/tabla']" class="btn-ir-tabla">
              Gestionar en Tabla
            </a>
          </div>
        }
      </div>

      <!-- Barra de filtros por característica, categoría y buscador -->
      <div class="barra-filtros-tarjetas">
        <div class="pills-categorias">
          <button type="button" (click)="seleccionarCategoria('')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === ''">
            Todos ({{ comidaArray.length }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Estrella')" class="pill-btn pill-estrella"
            [class.pill-activa]="filtroCategoria === 'Estrella'">
            ⭐ Platos Estrella ({{ contarPorEtiqueta('Estrella') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Vegetariano')" class="pill-btn pill-vegetariano"
            [class.pill-activa]="filtroCategoria === 'Vegetariano'">
            🌱 Vegetarianos ({{ contarPorEtiqueta('Vegetariano') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Picante')" class="pill-btn pill-picante"
            [class.pill-activa]="filtroCategoria === 'Picante'">
            🔥 Picantes ({{ contarPorEtiqueta('Picante') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Para Compartir')" class="pill-btn pill-compartir"
            [class.pill-activa]="filtroCategoria === 'Para Compartir'">
            👥 Para Compartir ({{ contarPorEtiqueta('Para Compartir') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Tradicional')" class="pill-btn pill-tradicional"
            [class.pill-activa]="filtroCategoria === 'Tradicional'">
            🌮 Tradicionales ({{ contarPorEtiqueta('Tradicional') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Tacos')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Tacos'">
            Tacos ({{ contarPorCategoria('Tacos') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Quesadillas')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Quesadillas'">
            Quesadillas ({{ contarPorCategoria('Quesadillas') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Entradas')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Entradas'">
            Entradas ({{ contarPorCategoria('Entradas') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Especialidades')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Especialidades'">
            Especialidades ({{ contarPorCategoria('Especialidades') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Burritos')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Burritos'">
            Burritos ({{ contarPorCategoria('Burritos') }})
          </button>
          <button type="button" (click)="seleccionarCategoria('Bebidas')" class="pill-btn"
            [class.pill-activa]="filtroCategoria === 'Bebidas'">
            🥤 Bebidas ({{ contarPorCategoria('Bebidas') }})
          </button>
        </div>

        <div class="caja-buscador">
          <input type="text" [value]="busqueda" (input)="onBuscar($event)" placeholder="Buscar por plato o ingrediente..."
            class="input-buscador" />
        </div>
      </div>

      <!-- Subcomponente: Cuadrícula de Tarjetas -->
      <app-comida-cards [comidas]="comidasFiltradas"></app-comida-cards>
    }

    <!-- =========================================================================
         MODO 2: VISTA DE TABLA (Subcomponentes PageTitle y ComidaTable)
         ========================================================================= -->
    @else {
      <div class="barra-superior-gestion">
        <app-page-title></app-page-title>
        <div class="acciones-header-tabla">
          <a [routerLink]="['/comidas/tarjetas']" class="btn-ir-tarjetas">
            &larr; Ver Menú en Tarjetas
          </a>
          @if (esAdmin) {
            <a [routerLink]="['/comidas/new']" class="btn-crear-comida">
              + CREAR COMIDA
            </a>
          }
        </div>
      </div>

      <app-comida-table
        [comidaArray]="comidaArray"
        [esAdmin]="esAdmin"
        (comidaDeleted)="eliminarComida($event)"
      ></app-comida-table>
    }

  </div>
</main>

<app-calaveras></app-calaveras>
<app-footer></app-footer>
