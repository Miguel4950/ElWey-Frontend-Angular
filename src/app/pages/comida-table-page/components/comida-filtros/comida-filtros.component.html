<!-- Barra de filtros por característica, categoría y buscador (Lego) -->
<div class="barra-filtros-tarjetas">
  <div class="pills-categorias">
    <button type="button" (click)="seleccionar('')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === ''">
      Todos ({{ comidaArray().length }})
    </button>
    <button type="button" (click)="seleccionar('Estrella')" class="pill-btn pill-estrella"
      [class.pill-activa]="filtroCategoria() === 'Estrella'">
      ⭐ Platos Estrella ({{ contarPorEtiqueta('Estrella') }})
    </button>
    <button type="button" (click)="seleccionar('Vegetariano')" class="pill-btn pill-vegetariano"
      [class.pill-activa]="filtroCategoria() === 'Vegetariano'">
      🌱 Vegetarianos ({{ contarPorEtiqueta('Vegetariano') }})
    </button>
    <button type="button" (click)="seleccionar('Picante')" class="pill-btn pill-picante"
      [class.pill-activa]="filtroCategoria() === 'Picante'">
      🌶️ Picantes ({{ contarPorEtiqueta('Picante') }})
    </button>
    <button type="button" (click)="seleccionar('Para Compartir')" class="pill-btn pill-compartir"
      [class.pill-activa]="filtroCategoria() === 'Para Compartir'">
      👥 Para Compartir ({{ contarPorEtiqueta('Para Compartir') }})
    </button>
    <button type="button" (click)="seleccionar('Tradicional')" class="pill-btn pill-tradicional"
      [class.pill-activa]="filtroCategoria() === 'Tradicional'">
      🌮 Tradicionales ({{ contarPorEtiqueta('Tradicional') }})
    </button>
    <button type="button" (click)="seleccionar('Tacos')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Tacos'">
      Tacos ({{ contarPorCategoria('Tacos') }})
    </button>
    <button type="button" (click)="seleccionar('Quesadillas')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Quesadillas'">
      Quesadillas ({{ contarPorCategoria('Quesadillas') }})
    </button>
    <button type="button" (click)="seleccionar('Entradas')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Entradas'">
      Entradas ({{ contarPorCategoria('Entradas') }})
    </button>
    <button type="button" (click)="seleccionar('Especialidades')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Especialidades'">
      Especialidades ({{ contarPorCategoria('Especialidades') }})
    </button>
    <button type="button" (click)="seleccionar('Burritos')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Burritos'">
      Burritos ({{ contarPorCategoria('Burritos') }})
    </button>
    <button type="button" (click)="seleccionar('Bebidas')" class="pill-btn"
      [class.pill-activa]="filtroCategoria() === 'Bebidas'">
      🥤 Bebidas ({{ contarPorCategoria('Bebidas') }})
    </button>
  </div>

  <div class="caja-buscador-contenedor">
    <div class="caja-buscador">
      <svg class="icono-lupa-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" [value]="busqueda()" (input)="onBuscarInput($event)" placeholder="Buscar por plato o ingrediente..."
        class="input-buscador" />
      @if (busqueda()) {
        <button type="button" (click)="limpiarBusqueda()" class="btn-limpiar-busqueda" title="Limpiar búsqueda">✕</button>
      }
    </div>
    @if (filtroCategoria() || busqueda()) {
      <div class="barra-info-filtro">
        <span class="texto-filtro-activo">
          Mostrando {{ totalFiltradas() }} de {{ comidaArray().length }} opciones
        </span>
        <button type="button" (click)="limpiarTodosLosFiltros()" class="btn-reestablecer-filtros">
          Ver carta completa
        </button>
      </div>
    }
  </div>
</div>
