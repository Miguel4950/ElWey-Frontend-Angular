@if (toast(); as t) {
  <aside class="contenedor-toast" [class.toast-success]="t.tipo === 'success'" [class.toast-warning]="t.tipo === 'warning'" [class.toast-info]="t.tipo === 'info'" role="status" aria-live="polite">
    <div class="icono-toast">
      @if (t.tipo === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      } @else if (t.tipo === 'warning') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      }
    </div>
    <div class="cuerpo-toast">
      <p class="texto-toast">{{ t.texto }}</p>
      @if (t.enlaceTexto && t.enlaceRuta) {
        <a [routerLink]="[t.enlaceRuta]" (click)="cerrar()" class="enlace-toast">{{ t.enlaceTexto }} &rarr;</a>
      }
    </div>
    <button type="button" (click)="cerrar()" class="btn-cerrar-toast" title="Cerrar notificacion">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </aside>
}
